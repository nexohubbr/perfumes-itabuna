<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfumes em Itabuna</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: Arial, sans-serif; background: #0a0a0a; color: #f5f0e8; }
  .upload-btn {
    position: fixed;
    bottom: 100px;
    right: 24px;
    width: 50px;
    height: 50px;
    background: #c9a961;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
</style>
</head>
<body>
  <h1>Perfumes em Itabuna</h1>
  
  <button class="upload-btn" id="uploadBtn" onclick="alert('Botão funcionando!')"></button>
  
  <script>
    // Botão só aparece com ?admin=secreto123
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'secreto123') {
      document.getElementById('uploadBtn').style.display = 'flex';
      console.log('Botão ativado!');
    }
  </script>
</body>
</html>
